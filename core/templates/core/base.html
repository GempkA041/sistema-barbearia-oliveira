<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Barbearia Oliveira{% endblock %}</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1E1E1E;
            --text-main: #FFFFFF;
            --text-muted: #E0E0E0;
            --accent: #F59E0B;
            --accent-hover: #D97706;
            --accent-text: #000000;
            --danger: #EF4444;
            --success: #10B981;
            --border: #404040;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.5;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        header a {
            color: var(--text-main);
            text-decoration: underline;
            font-weight: 600;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            padding: 0 8px;
        }

        .card {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        input[type="text"],
        input[type="tel"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            min-height: 48px;
            padding: 10px 14px;
            font-size: 1rem;
            background-color: #000000;
            color: #FFFFFF;
            border: 2px solid var(--text-muted);
            border-radius: 8px;
            margin-bottom: 16px;
        }

        input:focus, select:focus, .btn:focus, .option-label:focus-within {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 52px;
            min-width: 44px;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            background-color: var(--accent);
            color: var(--accent-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--text-main);
            margin-top: 12px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .hours-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            min-width: 44px;
            padding: 12px;
            background-color: #000000;
            border: 2px solid var(--text-muted);
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: center;
        }

        .option-label input[type="radio"] {
            width: 22px;
            height: 22px;
            margin-right: 10px;
            accent-color: var(--accent);
        }

        .option-label:has(input[type="radio"]:checked) {
            background-color: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        .alert {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 700;
            background-color: #3B0D0D;
            border: 2px solid var(--danger);
            color: #FFFFFF;
        }

        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 12px 8px;
            text-align: left;
        }
        th {
            background-color: #000000;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <header>
        <h1>💈 Barbearia Oliveira</h1>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'core:painel_barbeiro' %}">Painel</a>
            {% else %}
                <a href="{% url 'core:login' %}">Área do Barbeiro</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="alert" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
