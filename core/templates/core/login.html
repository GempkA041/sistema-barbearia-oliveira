{% extends "core/base.html" %}

{% block content %}
<div class="card">
    <h2>Acesso Restrito — Barbeiro</h2>
    {% if form.errors %}
        <div class="alert">Usuário ou senha incorretos.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Usuário</label>
        {{ form.username }}

        <label for="id_password">Senha</label>
        {{ form.password }}

        <button type="submit" class="btn">Entrar no Painel</button>
        <a href="{% url 'core:index' %}" class="btn btn-secondary">Voltar ao Início</a>
    </form>
</div>
{% endblock %}
